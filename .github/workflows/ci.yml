name: CI

on:
  push:
  pull_request:

defaults:
  run:
    # El proyecto Django vive en este subdirectorio del repo, no en la raíz.
    working-directory: military-inventory-scaffold

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: military-inventory-scaffold/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: python -m pytest
