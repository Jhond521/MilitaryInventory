<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; }
    a { color: #C0973F; } a:hover { color: #d8ad52; }
    .osw { font-family: "Oswald", sans-serif; }
  </style>
</helmet>

<div style="display: grid; grid-template-columns: 1.1fr 1fr; height: 900px;">

  <!-- Left brand panel -->
  <div style="position: relative; background: radial-gradient(120% 100% at 20% 10%, #1A2333 0%, #0E1420 55%, #080B12 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;">
    <div style="position: absolute; inset: 0; opacity: .10; background-image: repeating-linear-gradient(45deg, #C0973F 0 2px, transparent 2px 22px);"></div>
    <img src="logo.jpg" alt="Escudo del Batallón de Selva N.º 52" style="width: 250px; height: auto; position: relative; filter: drop-shadow(0 10px 30px rgba(0,0,0,.6));">
    <div class="osw" style="position: relative; margin-top: 28px; color: #F4F0E6; font-size: 34px; font-weight: 700; letter-spacing: 8px;">SIGA</div>
    <div style="position: relative; margin-top: 6px; color: #9AA0A8; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;">Sistema de Inventario de Armamento</div>
    <div style="position: relative; margin-top: 30px; padding: 8px 18px; border: 1px solid #33261A; border-radius: 30px; color: #C0973F; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;">Batallón de Selva N.º 52</div>
  </div>

  <!-- Right form -->
  <div style="background: #F4F0E6; display: flex; flex-direction: column; justify-content: center; padding: 0 84px;">
    <div class="osw" style="font-size: 30px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #10151E;">Acceso restringido</div>
    <div style="color: #6B6F76; font-size: 14px; margin-top: 8px; line-height: 1.5;">Solo el personal autorizado del batallón puede ingresar. Use el correo registrado.</div>

    <div style="margin-top: 34px;">
      <label style="display: block; font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #4A4E55;">Correo</label>
      <div style="margin-top: 8px; display: flex; align-items: center; background: #fff; border: 1px solid #D8CFB8; border-radius: 8px; height: 50px; padding: 0 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E0F1A" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <input placeholder="usuario@correo.com" style="border: none; outline: none; flex-grow: 1; padding: 0 12px; font-size: 15px; font-family: inherit; background: transparent; color: #1B1E24;">
      </div>
    </div>

    <div style="margin-top: 20px;">
      <label style="display: block; font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #4A4E55;">Contraseña</label>
      <div style="margin-top: 8px; display: flex; align-items: center; background: #fff; border: 1px solid #D8CFB8; border-radius: 8px; height: 50px; padding: 0 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E0F1A" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" value="000000000" style="border: none; outline: none; flex-grow: 1; padding: 0 12px; font-size: 15px; font-family: inherit; background: transparent; color: #1B1E24; letter-spacing: 3px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA0A6" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 13px;">
      <label style="display: flex; align-items: center; gap: 8px; color: #4A4E55;"><input type="checkbox" checked> Mantener sesión</label>
      <a href="#">¿Olvidó su contraseña?</a>
    </div>

    <button style="margin-top: 26px; height: 52px; background: #B01722; color: #fff; border: none; border-radius: 8px; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;">Ingresar</button>

    <div style="margin-top: 26px; display: flex; align-items: center; gap: 10px; color: #8A8F96; font-size: 12px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C0973F" stroke-width="2"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/></svg>
      Acceso limitado por lista de correos autorizados.
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
