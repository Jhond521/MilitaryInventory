<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; background: #F4F0E6; }
    a { color: #B01722; } a:hover { color: #8E0F1A; }
    .osw { font-family: "Oswald", sans-serif; }
    .mono { font-family: "IBM Plex Mono", monospace; }
    .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #6B6F76; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F4F0E6; display: flex; flex-direction: column; overflow: hidden;">

  <!-- app bar -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #0E1420; border-bottom: 2px solid #C0973F;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C0973F" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <span class="osw" style="color: #F4F0E6; font-size: 16px; letter-spacing: 1px; text-transform: uppercase;">Entregar armamento</span>
  </div>

  <div style="flex-grow: 1; overflow: auto; padding: 16px;">

    <!-- steps -->
    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 16px;">
      <span class="osw" style="width: 22px; height: 22px; border-radius: 50%; background: #B01722; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px;">1</span>
      <span style="font-size: 12px; font-weight: 600;">Arma</span>
      <div style="flex-grow: 1; height: 1px; background: #D8CFB8;"></div>
      <span class="osw" style="width: 22px; height: 22px; border-radius: 50%; background: #B01722; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px;">2</span>
      <span style="font-size: 12px; font-weight: 600;">Soldado</span>
      <div style="flex-grow: 1; height: 1px; background: #D8CFB8;"></div>
      <span class="osw" style="width: 22px; height: 22px; border-radius: 50%; background: #E4DCC8; color: #6B6F76; display: flex; align-items: center; justify-content: center; font-size: 12px;">3</span>
      <span style="font-size: 12px; color: #9A9FA6;">Confirmar</span>
    </div>

    <div class="lbl" style="margin-bottom: 6px;">Arma</div>
    <div style="display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #D8CFB8; border-radius: 10px; padding: 12px;">
      <div style="width: 38px; height: 38px; border-radius: 8px; background: #0E1420; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C0973F" stroke-width="1.7"><path d="M3 11h13l3-3v3h2v2h-6l-2 3v-3H3z"/></svg></div>
      <div style="flex-grow: 1;">
        <div class="mono" style="font-size: 15px; font-weight: 600; color: #8E0F1A;">23580001</div>
        <div style="font-size: 12px; color: #55595F;">ACE-23 · Fusil · Depósito Caruru</div>
      </div>
      <span style="background: #EDEFF2; color: #2C3340; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 14px;">En depósito</span>
    </div>

    <div class="lbl" style="margin: 16px 0 6px;">Soldado receptor <span style="color:#8E0F1A; text-transform: none; letter-spacing: 0;">— Compañía Alcatraz</span></div>
    <div style="display: flex; align-items: center; background: #fff; border: 1px solid #D8CFB8; border-radius: 10px; padding: 0 12px; height: 44px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E0F1A" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input value="Ramírez" style="border: none; outline: none; flex-grow: 1; padding: 0 10px; font-size: 14px; font-family: inherit; background: transparent;">
    </div>
    <div style="margin-top: 8px; background: #fff; border: 1px solid #E4DCC8; border-radius: 10px; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #FBE7E3;">
        <div class="osw" style="width: 34px; height: 34px; border-radius: 50%; background: #B01722; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px;">RG</div>
        <div style="flex-grow: 1;"><div style="font-size: 14px; font-weight: 600; color: #1B1E24;">SLP. Ramírez Gómez, Andrés</div><div style="font-size: 12px; color: #55595F;">Pelotón 2</div></div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B01722" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-top: 1px solid #F0EBDD;">
        <div class="osw" style="width: 34px; height: 34px; border-radius: 50%; background: #E4DCC8; color: #4A4E55; display: flex; align-items: center; justify-content: center; font-size: 13px;">RQ</div>
        <div style="flex-grow: 1;"><div style="font-size: 14px; color: #1B1E24;">SLP. Ramírez Quintero, Luis</div><div style="font-size: 12px; color: #55595F;">Pelotón 4</div></div>
      </div>
    </div>
  </div>

  <!-- action bar -->
  <div style="padding: 12px 16px 16px; background: #FBF9F3; border-top: 1px solid #E4DCC8;">
    <button style="width: 100%; height: 50px; background: #B01722; color: #fff; border: none; border-radius: 10px; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 1px; text-transform: uppercase;">Confirmar entrega</button>
  </div>
</div>
</x-dc>
</body>
</html>
