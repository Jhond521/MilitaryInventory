services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: armory
      POSTGRES_PASSWORD: armory
      POSTGRES_DB: armory
    ports:
      # Mapeado a 5433 en el host: 5432 ya lo usa otro proyecto local
      # (finanzasfamilia-db-1); dentro de la red de Docker `web` sigue
      # hablando con `db:5432` sin cambios.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armory"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      SECRET_KEY: dev-insecure-change-me
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://armory:armory@db:5432/armory
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
