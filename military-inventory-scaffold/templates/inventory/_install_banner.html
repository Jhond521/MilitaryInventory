<div class="siga-install-banner" id="siga-install-banner" hidden>
  <div class="siga-install-banner__icon">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
      <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div>
    <div class="siga-install-banner__title">Instala SIGA en tu teléfono</div>
    <div class="siga-install-banner__text">Agrégala a la pantalla de inicio y ábrela como una app.</div>
  </div>
  <button type="button" id="siga-install-button">Instalar</button>
  <button type="button" class="siga-install-banner__dismiss" id="siga-install-dismiss" aria-label="Cerrar">&times;</button>
</div>
<script>
  (function () {
    var banner = document.getElementById("siga-install-banner");
    var installBtn = document.getElementById("siga-install-button");
    var dismissBtn = document.getElementById("siga-install-dismiss");
    var deferredPrompt = null;

    function dismissed() {
      try {
        return localStorage.getItem("siga-install-dismissed") === "1";
      } catch (e) {
        return false;
      }
    }

    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      deferredPrompt = event;
      if (!dismissed()) banner.hidden = false;
    });

    installBtn.addEventListener("click", function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null;
        banner.hidden = true;
      });
    });

    dismissBtn.addEventListener("click", function () {
      banner.hidden = true;
      try {
        localStorage.setItem("siga-install-dismissed", "1");
      } catch (e) {}
    });
  })();
</script>
